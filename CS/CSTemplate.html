<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服 & Blog 生成器 Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Arial','Microsoft JhengHei',sans-serif}
.dot-bg{background-image:radial-gradient(circle,#cbd5e1 1px,transparent 1px);background-size:28px 28px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .2s ease forwards}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.tag-b{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
select option{background:white;color:#1f2937}
.chip-btn{transition:all .15s ease}
.ph{display:inline;background:#fef9c3;color:#92400e;border-radius:3px;padding:1px 4px;font-style:italic;font-size:.85em;border:1px dashed #fcd34d}
.blog-sec{font-weight:700;color:#1e293b;border-left:3px solid #3b82f6;padding-left:7px;display:block;margin:4px 0 2px}
.blog-sec-org{border-left-color:#f97316}
.blog-dateline{color:#94a3b8;font-size:11px}
.blog-field-label{display:block;font-size:11px;color:#64748b;margin-bottom:3px;margin-top:9px;font-weight:600}
.blog-inp{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:7px 11px;font-size:13px;color:#374151;background:white;outline:none;transition:all .15s;box-sizing:border-box}
.blog-inp:focus{border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.1)}
.blog-inp.maint:focus{border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.1)}
.blog-ta{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:7px 11px;font-size:13px;color:#374151;background:white;outline:none;transition:all .15s;resize:vertical;font-family:inherit;line-height:1.6;box-sizing:border-box}
.blog-ta:focus{border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.1)}
.blog-ta.maint:focus{border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.1)}
</style>
</head>
<body class="bg-slate-50 overflow-hidden h-screen">
<div class="fixed inset-0 dot-bg opacity-20 pointer-events-none z-0"></div>

<!-- HEADER -->
<header class="relative z-20 bg-white/95 backdrop-blur-sm border-b border-slate-200 px-4 py-2.5 flex items-center gap-3 shadow-sm" style="height:52px">
  <div class="w-7 h-7 bg-blue-600 rounded-xl flex items-center justify-center shadow-sm flex-shrink-0">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <span class="font-bold text-slate-900 tracking-tight text-sm hidden sm:block">客服回應生成器 Pro</span>
  <div class="mx-auto flex bg-slate-100 rounded-xl p-0.5 gap-0.5">
    <button id="mode-cs" onclick="setMode('cs')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-sm">💬 客服回應</button>
    <button id="mode-blog" onclick="setMode('blog')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all">📝 Blog 內容</button>
  </div>
  <span id="hdr-count" class="text-xs font-mono bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-full font-semibold hidden sm:block flex-shrink-0"><span id="total-count">0</span> 模板</span>
</header>

<!-- ═══════════ CS MODE ═══════════ -->
<div id="cs-container" class="relative z-10 flex overflow-hidden" style="height:calc(100vh - 52px)">
  <div class="w-5/12 min-w-64 max-w-sm bg-white border-r border-slate-200 flex flex-col overflow-hidden shadow-sm">
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">品牌 / 負責人</p>
        <div class="space-y-2">
          <input id="brand" type="text" placeholder="品牌名稱" value="OmniStompboxs" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
          <input id="agent" type="text" placeholder="負責人 / 客服名稱（選填）" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
          <div class="grid grid-cols-2 gap-2">
            <input id="co-email" type="text" placeholder="cs@example.com" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 font-mono bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
            <input id="co-wa" type="text" placeholder="+852 XXXX XXXX" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-600 font-mono bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
          </div>
        </div>
      </div>
      <hr class="border-slate-100">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">客戶資料</p>
        <div class="space-y-2">
          <input id="cname" type="text" placeholder="客戶稱呼，例：陳先生 / ABC公司 李經理" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
          <input id="ref" type="text" placeholder="參考編號 / 日期（選填）" oninput="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 font-mono bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition">
          <div><label class="block text-xs text-slate-400 mb-1.5">客戶類型</label><div id="ctype-chips" class="flex flex-wrap gap-1.5"></div></div>
        </div>
      </div>
      <hr class="border-slate-100">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">情況類別</p>
        <div class="space-y-2">
          <div><label class="block text-xs text-slate-400 mb-1">主要類別</label><select id="cat" onchange="onCatChange()" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition cursor-pointer"></select></div>
          <div><label class="block text-xs text-slate-400 mb-1">細分情況</label><select id="subcat" onchange="update()" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition cursor-pointer"></select></div>
          <div><label class="block text-xs text-slate-400 mb-1.5">處理狀態</label><div id="status-chips" class="flex flex-wrap gap-1.5"></div></div>
        </div>
      </div>
      <hr class="border-slate-100">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">語氣風格</p>
        <div class="space-y-2.5">
          <div><label class="block text-xs text-slate-400 mb-1.5">態度語氣</label><div id="tone-chips" class="flex flex-wrap gap-1.5"></div></div>
          <div><label class="block text-xs text-slate-400 mb-1.5">語言風格</label><div id="style-chips" class="flex flex-wrap gap-1.5"></div></div>
        </div>
      </div>
      <hr class="border-slate-100">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2.5">附加選項</p>
        <div class="space-y-2">
          <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer"><input type="checkbox" id="opt-contact" checked onchange="ST.addContact=this.checked;refreshPreview()" class="w-4 h-4 cursor-pointer accent-blue-600">附加聯絡方式（電郵 / WhatsApp）</label>
          <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer"><input type="checkbox" id="opt-sign" checked onchange="ST.addSign=this.checked;refreshPreview()" class="w-4 h-4 cursor-pointer accent-blue-600">附加署名落款</label>
        </div>
      </div>
      <div class="h-4"></div>
    </div>
  </div>
  <div class="flex-1 flex flex-col overflow-hidden bg-slate-50/80">
    <div class="bg-white border-b border-slate-200 px-5 py-3 flex items-center gap-3 flex-shrink-0 shadow-sm">
      <span class="text-sm font-bold text-slate-700 hidden sm:block">預覽</span>
      <div class="flex bg-slate-100 rounded-xl p-0.5 gap-0.5">
        <button id="btn-email" onclick="setChannel('email')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-sm">✉️ 電郵</button>
        <button id="btn-wa" onclick="setChannel('whatsapp')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all">💬 WhatsApp</button>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span id="ch-badge" class="text-xs font-mono text-slate-400 hidden sm:block"></span>
        <button id="copy-btn" onclick="copyMsg()" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white transition-all active:scale-95 shadow-sm">📋 複製</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-5">
      <div class="max-w-xl mx-auto space-y-3 fi">
        <div id="tag-row" class="flex flex-wrap gap-1.5 min-h-6"></div>
        <div id="subject-box" class="bg-white border border-slate-200 rounded-xl px-4 py-3 shadow-sm"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">電郵主旨</span><p id="subject-text" class="text-sm font-semibold text-slate-800 mt-1"></p></div>
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"><div id="msg-body" class="text-sm leading-relaxed text-slate-700 whitespace-pre-wrap font-sans"></div></div>
        <div id="ch-hint" class="text-center text-xs text-slate-400 pb-2"></div>
      </div>
    </div>
    <div class="bg-white border-t border-slate-100 px-5 py-2 text-center text-xs text-slate-400 flex-shrink-0">created by Tabris Yuen @2026</div>
  </div>
</div>

<!-- ═══════════ BLOG MODE ═══════════ -->
<div id="blog-container" class="relative z-10 flex overflow-hidden" style="height:calc(100vh - 52px);display:none">
  <!-- Blog Left Panel -->
  <div class="w-5/12 min-w-64 max-w-96 bg-white border-r border-slate-200 flex flex-col overflow-hidden shadow-sm">
    <div class="flex-1 overflow-y-auto p-4">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">內容類型</p>
      <div id="blog-type-chips" class="flex flex-wrap gap-1.5 mb-3"></div>
      <hr class="border-slate-100 mb-3">

      <!-- ─── 系統更新 FORM ─── -->
      <div id="blog-update-form">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">📋 文章設定</p>
        <label class="blog-field-label">系統名稱</label><input id="b-sysName" type="text" placeholder="例：OmniStompboxs ERP" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">更新重點（標題用）</label><input id="b-updateKey" type="text" placeholder="例：批量發票匯出功能" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">功能名稱</label><input id="b-funcName" type="text" placeholder="例：批量匯出功能" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">功能模組</label><input id="b-funcModule" type="text" placeholder="例：財務管理模組" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">更新日期</label><input id="b-updateDate" type="text" placeholder="例：2026 年 11 月 16 日" oninput="blogUpdate()" class="blog-inp" style="font-family:monospace">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">📄 摘要資料</p>
        <label class="blog-field-label">使用角色</label><input id="b-userRole" type="text" placeholder="例：財務人員" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">工作情境</label><input id="b-workContext" type="text" placeholder="例：每月結算及發票處理" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">實際改善</label><input id="b-improvement" type="text" placeholder="例：一次過匯出多張發票，節省重複操作" oninput="blogUpdate()" class="blog-inp">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">✍️ 更新描述</p>
        <label class="blog-field-label">原有做法或困難</label><textarea id="b-oldMethod" rows="2" placeholder="例：逐張開啟發票、個別下載 PDF" oninput="blogUpdate()" class="blog-ta"></textarea>
        <label class="blog-field-label">更新名稱</label><input id="b-updateTitle" type="text" placeholder="例：批量 PDF 匯出功能" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">已確認的改善</label><input id="b-confirmedImprove" type="text" placeholder="例：用戶可在一個頁面同時選取多張發票並匯出" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">新增或調整功能說明（詳細）</label><textarea id="b-whatChanged" rows="3" placeholder="寫清楚實際行為，以及與原有版本的分別" oninput="blogUpdate()" class="blog-ta"></textarea>
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">🎯 適用對象</p>
        <label class="blog-field-label">適用角色</label><input id="b-targetRole" type="text" placeholder="例：財務人員、管理員" oninput="blogUpdate()" class="blog-inp">
        <label class="blog-field-label">用途（如何利用此更新）</label><textarea id="b-usage" rows="2" placeholder="例：批量匯出指定月份的所有客戶發票" oninput="blogUpdate()" class="blog-ta"></textarea>
        <label class="blog-field-label">減少的重複工作或問題</label><input id="b-reduceWork" type="text" placeholder="例：逐張下載的時間及出錯機會" oninput="blogUpdate()" class="blog-inp">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">📖 使用指引</p>
        <label class="blog-field-label">操作步驟一</label><textarea id="b-step1" rows="2" placeholder="例：進入「財務管理」→「發票列表」" oninput="blogUpdate()" class="blog-ta"></textarea>
        <label class="blog-field-label">操作步驟二</label><textarea id="b-step2" rows="2" placeholder="例：勾選所需發票，點擊「批量匯出」→選擇格式（PDF / Excel）" oninput="blogUpdate()" class="blog-ta"></textarea>
        <label class="blog-field-label">完成後會看到的結果</label><input id="b-afterResult" type="text" placeholder="例：系統自動打包壓縮並下載至本機" oninput="blogUpdate()" class="blog-inp">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">⚠️ 適用範圍與注意事項</p>
        <textarea id="b-scope" rows="3" placeholder="適用系統、模組、帳戶角色、是否需要啟用，以及已知限制。只填已確認資料。" oninput="blogUpdate()" class="blog-ta" style="margin-top:4px"></textarea>
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">🚀 下一步</p>
        <label class="blog-field-label">已使用客戶應做甚麼</label><textarea id="b-nextExisting" rows="2" placeholder="例：已訂閱 ERP 財務模組的客戶，功能已自動更新，直接使用即可" oninput="blogUpdate()" class="blog-ta"></textarea>
        <label class="blog-field-label">功能頁連結</label><input id="b-pageLink" type="text" placeholder="https://..." oninput="blogUpdate()" class="blog-inp" style="font-family:monospace">
      </div>

      <!-- ─── 維護通知 FORM ─── -->
      <div id="blog-maint-form" style="display:none">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">🏷 基本資料</p>
        <label class="blog-field-label">系統名稱</label><input id="b-maintSysName" type="text" placeholder="例：OmniStompboxs ERP" oninput="blogUpdate()" class="blog-inp maint">
        <label class="blog-field-label">維護日期（標題用）</label><input id="b-maintDate" type="text" placeholder="例：2026 年 11 月 20 日" oninput="blogUpdate()" class="blog-inp maint" style="font-family:monospace">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">🕐 維護時間</p>
        <label class="blog-field-label">開始日期及時間</label><input id="b-startTime" type="text" placeholder="例：2026 年 11 月 20 日 凌晨 02:00" oninput="blogUpdate()" class="blog-inp maint" style="font-family:monospace">
        <label class="blog-field-label">預計結束日期及時間</label><input id="b-endTime" type="text" placeholder="例：2026 年 11 月 20 日 凌晨 05:00" oninput="blogUpdate()" class="blog-inp maint" style="font-family:monospace">
        <label class="blog-field-label">時區</label><input id="b-timezone" type="text" placeholder="HKT (UTC+8)" value="HKT (UTC+8)" oninput="blogUpdate()" class="blog-inp maint" style="font-family:monospace">
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">⚡ 影響說明</p>
        <label class="blog-field-label">受影響服務（摘要用）</label><input id="b-affectedService" type="text" placeholder="例：所有系統功能" oninput="blogUpdate()" class="blog-inp maint">
        <label class="blog-field-label">暫停方式</label>
        <div id="stop-type-chips" class="flex gap-1.5 mt-1 mb-1 flex-wrap"></div>
        <label class="blog-field-label">維護目的</label><input id="b-maintPurpose" type="text" placeholder="例：系統版本升級及資料庫優化" oninput="blogUpdate()" class="blog-inp maint">
        <label class="blog-field-label">受影響範圍詳細說明</label><textarea id="b-affectedDetail" rows="3" placeholder="受影響的系統、模組、用戶及操作" oninput="blogUpdate()" class="blog-ta maint"></textarea>
        <label class="blog-field-label">未受影響服務（如已確認）</label><textarea id="b-unaffectedDetail" rows="2" placeholder="例：只讀報表功能在前半段維護時間仍可正常使用" oninput="blogUpdate()" class="blog-ta maint"></textarea>
        <hr class="border-slate-100 my-3">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">📋 注意事項與聯絡</p>
        <label class="blog-field-label">維護前需要完成的操作</label><textarea id="b-beforeNote" rows="2" placeholder="例：請確保所有進行中的匯出任務已完成，並儲存草稿" oninput="blogUpdate()" class="blog-ta maint"></textarea>
        <label class="blog-field-label">完成後通知渠道</label><input id="b-notifyChannel" type="text" placeholder="例：本頁面及電郵通知" oninput="blogUpdate()" class="blog-inp maint">
        <label class="blog-field-label">查詢聯絡方式</label><input id="b-contactMethod" type="text" placeholder="例：cs@OmniStompboxs.com / WhatsApp +852 XXXX XXXX" oninput="blogUpdate()" class="blog-inp maint">
      </div>
      <div class="h-6"></div>
    </div>
  </div>

  <!-- Blog Right Panel -->
  <div class="flex-1 flex flex-col overflow-hidden bg-slate-50/80">
    <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-2 flex-shrink-0 shadow-sm">
      <span class="text-sm font-bold text-slate-700 hidden sm:block flex-shrink-0">Blog 預覽</span>
      <div class="flex bg-slate-100 rounded-xl p-0.5 gap-0.5 ml-2">
        <button onclick="copyBlogSection('title')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all">標題</button>
        <button onclick="copyBlogSection('summary')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all">摘要</button>
        <button onclick="copyBlogSection('body')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all">內文</button>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span id="blog-total-count" class="text-xs font-mono text-slate-400 hidden sm:block"></span>
        <button id="copy-blog-all-btn" onclick="copyBlogSection('all')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition-all active:scale-95 shadow-sm">📋 複製全文</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-5">
      <div class="max-w-xl mx-auto space-y-3 fi">
        <div id="blog-tag-row" class="flex flex-wrap gap-1.5 min-h-6"></div>

  '主要痛點':{e:`為針對性地為您推薦功能模組，麻煩告知貴機構目前主要面對的業務挑戰：\n\n• 哪些流程最耗費時間或人手？\n• 資料管理方面有哪些困難？\n• 現有系統有哪些不足之處？\n• 主要希望通過新系統解決哪些問題？`,w:`請告知目前業務上最大的痛點是什麼？（例如：手動處理太費時、資料不一致、系統太舊等）這樣我們可以針對性推薦模組 🎯`},
  '現有系統及資料格式':{e:`為評估資料遷移的可行性及工作量，麻煩提供以下資料：\n\n• 現有系統名稱及版本\n• 主要資料類型（客戶資料、訂單記錄、庫存資料等）\n• 現有資料格式（Excel、CSV、資料庫匯出等）\n• 資料量估算（約多少筆記錄）`,w:`請問目前使用什麼系統？現有資料主要是什麼格式（Excel/CSV/其他系統匯出）？有助評估資料遷移工作量 📂`},
  '渠道與倉庫數量':{e:`為確保系統架構能涵蓋貴機構全部業務，麻煩提供以下資料：\n\n• 銷售渠道數量（門市、網店、批發等）\n• 倉庫或存貨地點數量\n• 各渠道及倉庫是否需要獨立報表或權限設定`,w:`請問有多少個銷售渠道（門市/網店等）和倉庫？各自是否需要獨立管理和報表？有助確認系統配置 🏭`},
  '整合需求':{e:`為評估系統整合工作，麻煩提供以下資料：\n\n• 需要整合的現有系統名稱\n• 整合所需的資料類型及同步方向\n• 整合優先級（哪些是必須，哪些是選擇性）\n• 相關系統是否提供 API 文件`,w:`請問需要與哪些系統整合？（例如 POS、會計軟件、網店平台）需要整合哪些資料？技術團隊可以評估可行性 🔗`},
  '訂製需求':{e:`感謝提出訂製需求。為評估開發可行性及成本，麻煩提供以下資料：\n\n• 功能描述（越詳細越好）\n• 使用場景及使用者角色\n• 預期介面或流程（如有截圖或說明文件更佳）\n• 優先級及預期完成時間`,w:`收到訂製需求！請提供詳細功能描述（功能是什麼、誰用、怎麼用），越詳細越好。技術團隊評估可行性及報價 ✍️`},
  '預算與期望時間':{e:`為確保提供的方案符合貴機構的預算及時間要求，麻煩告知：\n\n• 大概的預算範圍\n• 期望系統上線時間（有沒有特定截止日期）\n• 是否需要分階段導入`,w:`請問大概的預算範圍和期望上線時間？有助設計最合適的方案，也可以考慮分階段導入 📅`},
  '資料不足補問':{e:`感謝您之前提供的資料。為確保我們能夠提供更準確的方案建議，以下資料需要補充：\n\n[請說明具體需要補充的資料]\n\n請問方便提供以上資料嗎？如有任何問題，歡迎隨時聯絡我們。`,w:`感謝之前的資料！我們還需要一些補充才能提供更準確的建議，請問方便回應嗎？🙏`},
 },
 '示範安排':{
  '邀請預約':{e:`誠意邀請您參加一次線上系統示範，讓您親眼了解系統如何切合貴機構的業務需要。\n\n示範會議約 30–45 分鐘，將針對您的業務類型及關注功能進行展示。請問以下時段是否方便？`,w:`誠邀您參加 {brand} 線上示範（約 30-45 分鐘，針對您的需求展示功能）。請問什麼時間方便？📅`},
  '收集時段':{e:`感謝您表示有興趣參加示範。麻煩提供 2–3 個方便的時段，我們將盡快確認安排。\n\n示範會議將以視像形式進行，請確保屆時可在電腦前參與，以便清晰查看系統介面。`,w:`請提供 2-3 個方便的時段，我們盡快確認示範安排 📅`},
  '確認預約':{e:`現確認示範預約安排如下：\n\n📅 日期及時間：{ref}\n🖥️ 形式：視像會議\n⏱️ 預計時長：30–45 分鐘\n\n會議連結將在示範前送上。如需更改時間，請提前通知我們。`,w:`✅ 示範已確認！\n📅 時間：{ref}\n🖥️ 視像會議，約 30-45 分鐘\n連結稍後發送。如需更改請提前通知 🙏`},
  '示範前準備':{e:`為確保示範順利進行，麻煩在會議前完成以下準備：\n\n• 確認電腦已安裝最新版本瀏覽器（Chrome / Safari）\n• 確認麥克風及喇叭正常運作\n• 如有特定希望在示範中查看的功能，歡迎提前告知`,w:`示範前小提醒：\n✅ 更新瀏覽器至最新版\n✅ 確認麥克風/喇叭正常\n✅ 有特定想了解的功能，提前告知我們！`},

  '提供會議連結':{e:`感謝您確認參與示範。以下是視像會議的連結及詳情：\n\n🔗 會議連結：[連結請另行補充]\n📅 時間：{ref}\n\n如連結有任何問題，請隨時聯絡我們。`,w:`示範會議連結如下 👇\n🔗 [連結請另行補充]\n📅 時間：{ref}\n有問題請隨時告知！`},
  '改期':{e:`收到您的改期請求，我們理解突發情況難以預計，請放心。\n\n麻煩告知您方便的新時段（建議提供 2–3 個選擇），我們將盡快確認新的示範安排。`,w:`收到！完全理解需要改期 😊 請告知方便的新時段（提供 2-3 個選擇），我們盡快確認 📅`},
  '取消':{e:`收到您的取消通知，我們已取消原定的示範安排。\n\n如日後您希望重新安排示範，或有任何查詢，歡迎隨時聯絡我們。`,w:`收到！已取消示範安排 ✅ 如之後想重新預約，隨時告知 😊`},
  '客戶缺席':{e:`我們注意到您未能出席原定於 {ref} 的會議，希望一切安好。\n\n如有任何突發情況，我們完全理解。如您希望重新安排，歡迎告知方便的時間。`,w:`您好！留意到您未能出席剛才的會議，希望一切安好 🙏 如方便請告知，我們可以隨時重新安排 😊`},
  '示範後摘要':{e:`感謝您今日參與 {brand} 系統示範，希望今日的展示能讓您對系統有更清晰的了解。\n\n以下是今日示範的主要重點摘要：\n• [主要展示功能]\n• [討論重點]\n\n如您有任何跟進問題，歡迎隨時聯絡。`,w:`感謝今日的示範！希望展示對您有幫助 😊 如有跟進問題歡迎隨時問，方案建議稍後跟進 📋`},
  '發送專屬簡報':{e:`如承諾，現附上為貴機構度身整理的 {brand} 系統簡報，內容包括：\n\n• 與貴機構業務相關的功能模組\n• 實施建議方案\n• 初步費用估算\n\n如有任何問題或希望深入了解某個部分，歡迎隨時聯絡。`,w:`簡報已整理好發送給您 📎 包含相關功能、建議方案及初步費用估算。請查閱後如有問題隨時問 😊`},
  '示範後跟進':{e:`感謝您參與 {brand} 的系統示範。距離示範已有數天，希望您已有機會查閱我們的方案簡報。\n\n請問您對我們的方案有什麼看法？有沒有需要進一步了解的功能或未解答的問題？`,w:`您好！跟進一下上次的示範，請問有沒有機會查閱方案簡報？有什麼問題或想法都歡迎告知 😊`},

 '報價與方案':{
  '報價前補充資料':{e:`為確保報價準確反映貴機構的實際需要，麻煩補充以下資料：\n\n• 預計使用人數（按角色分類）\n• 所需功能模組（如已確定）\n• 是否有訂製需求\n• 目標上線時間`,w:`感謝報價要求！在準備報價前，請補充：使用人數（各角色）、所需功能模組、有無訂製需求、目標上線時間 📋`},
  '發送報價':{e:`請查閱附上的 {brand} 系統報價書（報價編號：{ref}）。\n\n報價內容包括：\n• 建議功能模組組合\n• 費用明細\n• 實施方案概述\n• 付款條款\n\n報價有效期為 30 日。如有任何問題，歡迎隨時聯絡。`,w:`報價書已發送（編號：{ref}）📎 包含功能模組、費用明細及付款條款，有效期 30 日。有問題歡迎隨時問！`},
  '解釋模組組合':{e:`就報價中的功能模組組合，我們根據貴機構的業務規模、使用人數及主要需求配置。各模組可獨立運作，亦可相互整合，資料共享無縫流通。\n\n如希望調整模組組合（增加或移除某些模組），歡迎告知，我們可以為您重新計算費用。`,w:`報價中的模組組合是按您的業務需求配搭的。如想增加/移除某些模組，請告知，我們可以調整報價 😊`},
  '解釋費用項目':{e:`就報價中的各項費用說明：\n\n• 系統授權費：按用戶人數及功能模組計算的年費\n• 導入設定費：一次性費用，包括系統設定、資料遷移及培訓\n• 訂製開發費：按訂製需求另行計算（如適用）\n• 維護支援費：每年系統維護及技術支援\n\n如對任何費用項目有疑問，歡迎告知。`,w:`費用分為：授權費（年費按用戶/模組）、導入費（一次性）、訂製費（如有）、維護費。有任何不清楚請告知 💰`},
  '解釋訂製範圍':{e:`就報價中的訂製開發範圍，訂製開發將按照雙方確認的功能規格進行，完成後需要貴機構驗收確認。如後續有新增需求，將按實際工作量另行報價。`,w:`訂製範圍：按雙方確認規格開發，完成後需要您驗收確認。後續新增需求會按工作量另行報價 ✅`},
  '解釋第三方費用':{e:`部分系統功能需要使用第三方服務（例如：雲端儲存、短訊通知、地圖服務等），相關費用由貴機構直接向服務供應商支付，並非 {brand} 收費範圍。我們會在合約中列明涉及的第三方服務，確保費用透明。`,w:`部分功能需要第三方服務（如雲端儲存/短訊費用），費用直接付給服務商，不計入 {brand} 報價。合約會列明說明 ✅`},
  '報價修訂':{e:`根據您的回覆，我們已按要求修訂報價（修訂版本：{ref}）。\n\n修訂後報價有效期重新計算為 30 日。如對修訂內容有任何問題，歡迎告知。`,w:`已按您要求修訂報價（版本：{ref}）📎 有效期重新計算 30 日。有問題請隨時告知！`},
  '報價到期提醒':{e:`溫馨提醒，您的 {brand} 系統報價（編號：{ref}）將於近期到期。\n\n如您仍有興趣，歡迎在到期前確認，或聯絡我們討論是否需要更新報價。`,w:`⏰ 提醒：報價（{ref}）即將到期！如有興趣請盡快確認，或告知我們是否需要更新方案 😊`},
  '報價跟進':{e:`就之前發送的 {brand} 系統報價（編號：{ref}），希望了解貴機構的考慮進度。\n\n如有任何疑問、或希望進一步討論方案細節，歡迎隨時聯絡。`,w:`您好！跟進一下之前的報價（{ref}），請問考慮得怎樣？有問題歡迎隨時問，也可以調整方案 😊`},
  '議價回應':{e:`感謝您的回覆及坦誠溝通。就您的預算考量，以下是可以考慮的調整方向：\n\n• 調整功能模組組合（移除暫時不需要的模組）\n• 分階段導入，分攤初期費用\n• 調整付款方式\n\n請告知您的優先考量，我們會盡力提出切合的解決方案。`,w:`理解您的預算考量！可以考慮調整模組組合、分階段導入或調整付款方式。請告知優先考量，我們盡力配合 💪`},
  '超出預算':{e:`我們理解預算是重要的考量因素。為配合您的預算，建議考慮：\n\n• 精簡版方案：只保留核心必要模組，後期按需擴展\n• 分階段導入：分批實施，分散費用\n• 調整用戶數量：先以核心團隊開始使用\n\n麻煩告知您的預算範圍，我們可以為您重新設計方案。`,w:`理解預算限制！可以考慮：精簡版先用核心模組、分階段導入分散費用、先減少用戶數量。請告知大概預算範圍，我們重新設計方案 🙏`},
  '暫未決定':{e:`完全理解，系統選型是重要決定，需要充分考慮。\n\n如您在考慮過程中有任何問題，或需要補充任何資料，歡迎隨時聯絡。我們不希望給您造成壓力，請按您的進度決定。`,w:`完全理解！這是重要決定，需要好好考慮 😊 有任何問題隨時可以問，不用擔心打擾，我們不急著催您 🙏`},
  '接受報價':{e:`非常感謝您確認接受 {brand} 系統方案！我們十分期待與貴機構展開合作。\n\n接下來我們將安排：\n• 發送合約文件供簽署\n• 安排項目啟動會議\n• 分配專屬負責人跟進您的項目`,w:`太好了！感謝確認合作 🎉 接下來會發送合約、安排啟動會議，並為您分配專屬負責人。期待合作！😊`},
  '未能承接':{e:`感謝您的查詢及考慮。非常遺憾是次未能為您提供服務。\n\n如日後情況有所改變，我們歡迎您再次聯絡。感謝您對 {brand} 的關注，祝業務一切順利。`,w:`感謝您的考慮。很遺憾是次未能承接。如日後情況有所改變，歡迎再聯絡，祝業務順利 🙏`},

  '介紹負責人':{e:`現為您介紹貴機構的專屬項目負責人：{agent}。\n\n{agent} 將全程跟進您的系統導入項目，從合約簽署至系統上線，確保每個階段順利完成。如有任何問題，可直接聯絡 {agent}。`,w:`為您介紹專屬負責人 {agent}！由啟動到上線全程跟進您的項目。有任何問題直接找 {agent} 就好 😊`},
  '項目啟動會議':{e:`為正式啟動 {brand} 系統導入項目，建議安排一次項目啟動會議（約 60 分鐘），議程包括：\n\n• 確認項目範圍及目標\n• 介紹雙方負責人及聯絡方式\n• 確認時間表及里程碑\n• 討論資料收集及遷移安排\n\n請問您方便在哪個時段安排此次會議？`,w:`建議安排項目啟動會議（約 60 分鐘），確認範圍、時間表及分工安排。請問您方便什麼時段？📅`},
  '確認範圍':{e:`根據合約及雙方討論，現確認本次項目範圍如下：\n\n• 功能模組：[模組列表]\n• 訂製內容：[訂製項目]\n• 整合系統：[整合項目]\n\n請確認以上範圍是否準確。如有任何調整，請在專案啟動前提出。`,w:`確認項目範圍：功能模組、訂製內容、整合需求如合約所列。請確認無誤，有調整請盡快提出 ✅`},
  '確認分工':{e:`為確保項目推進順暢，以下是雙方的分工安排：\n\n{brand} 負責：技術開發、系統設定、培訓安排\n貴機構負責：提供資料、測試驗收、用戶協調\n\n如對分工安排有任何問題或建議，歡迎告知。`,w:`確認分工：我方負責技術及培訓，貴機構負責提供資料及確認測試。如有問題請告知 ✅`},
  '確認里程碑':{e:`以下是本項目的主要里程碑時間表：\n\n• [日期]：需求確認及設定完成\n• [日期]：資料遷移完成\n• [日期]：測試環境開放\n• [日期]：培訓完成\n• [日期]：系統正式上線\n\n請確認時間表是否切實可行。如任何里程碑需要調整，請盡早告知。`,w:`項目時間表：[各里程碑日期]。請確認是否可行，有需要調整請盡早告知 📅`},
  '收集品牌素材':{e:`為進行系統介面設定，麻煩提供以下品牌素材：\n\n• 機構 Logo（建議高解析 PNG 或 SVG 格式）\n• 品牌主色色碼\n• 官方機構名稱（中英文）\n\n如有品牌設計指引（Brand Guidelines），亦歡迎一併提供。`,w:`麻煩提供品牌素材：Logo（高清 PNG/SVG）、品牌主色色碼、機構名稱（中英文）。有 Brand Guidelines 也可以一起發 🎨`},
  '收集帳戶及整合資料':{e:`為進行系統設定及第三方整合，麻煩提供以下資料：\n\n• 管理員帳戶資料（姓名、電郵）\n• 需要整合的系統帳戶或 API 金鑰\n• 相關系統管理員聯絡方式\n\n請注意，所有帳戶資料請透過安全渠道提交，切勿透過一般即時通訊傳送。`,w:`麻煩提供帳戶資料及整合所需 API 金鑰等。請注意：敏感資料請用安全渠道（如加密郵件）傳送，切勿用 WhatsApp/普通電郵 🔐`},
  '提醒使用安全渠道交付敏感資料':{e:`重要提醒：在提交帳戶資料、API 金鑰、密碼等敏感資料時，請務必使用安全渠道，例如：\n\n• 加密電郵\n• 密碼管理工具分享功能\n• 我們提供的安全提交表格\n\n請切勿透過一般 WhatsApp、SMS 或普通電郵傳送敏感資料，以保障貴機構的資訊安全。`,w:`⚠️ 重要提醒：密碼/API 金鑰等敏感資料請勿用 WhatsApp 或普通電郵傳送！請使用加密郵件或我們提供的安全表格 🔐`},
 },
 '系統導入':{
  '導入計劃':{e:`系統導入計劃已確認，主要分以下階段進行：\n\n① 需求確認及環境設定（第 1–2 週）\n② 資料遷移及初步設定（第 3–4 週）\n③ 測試及修正（第 5–6 週）\n④ 培訓安排（第 7 週）\n⑤ 正式上線（第 8 週）`,w:`導入計劃已確認，共分 5 個階段：環境設定 → 資料遷移 → 測試修正 → 培訓 → 正式上線。詳細時間表稍後確認 📋`},
  '資料匯入指引':{e:`為確保資料順利遷移至 {brand} 系統，請參考以下匯入指引：\n\n• 資料格式：請使用我們提供的 Excel 範本\n• 必填欄位：範本中標示黃色底色的欄位\n• 資料清洗：請確保資料無重複、格式統一\n• 提交方式：通過系統管理後台上傳，或透過安全渠道傳送`,w:`資料遷移指引：請用我們提供的 Excel 範本、填寫必填欄位、確保資料無重複。有問題隨時問 📂`},
  '提供匯入範本':{e:`請查閱附上的資料匯入範本（Excel 格式）。\n\n• 黃色底色欄位為必填\n• 請勿修改欄位標題列\n• 日期格式請統一使用 YYYY-MM-DD\n\n填寫完成後，請發送給我們或通過系統管理後台上傳。`,w:`資料匯入範本已附上 📎 黃色欄位為必填，請勿修改標題列，日期格式用 YYYY-MM-DD。填好後發給我們或上傳後台 ✅`},
  '資料缺漏':{e:`感謝您提交的資料。我們在核對過程中發現以下缺漏資料：\n\n• [具體缺漏說明]\n\n麻煩提供以上補充資料，以便我們繼續進行資料遷移。`,w:`核對資料時發現有些資料缺漏：[具體說明]。麻煩補充一下，謝謝 🙏`},

  '重複資料':{e:`感謝您提交的資料。我們發現資料中存在以下重複記錄：\n\n• [重複記錄說明]\n\n請確認需要保留哪筆記錄，或告知合併方式，以便我們正確處理資料遷移。`,w:`資料中發現有重複記錄：[說明]。請確認保留哪筆或如何合併，我們再繼續處理 🙏`},
  '資料核對':{e:`資料遷移已初步完成。請按照以下清單核對已遷移的資料：\n\n• [核對項目]\n\n麻煩完成核對後告知結果，如發現任何差異，請提供具體說明以便我們修正。`,w:`資料遷移初步完成！請核對一下：[核對項目]。核對後告知結果，有問題我們修正 ✅`},
  '匯入完成':{e:`所有資料已成功遷移至 {brand} 系統，資料核對均無異常。\n\n接下來將進入系統測試階段，我們將為您準備測試環境及測試帳戶。`,w:`資料遷移完成！✅ 核對無異常，接下來進入系統測試階段，測試帳戶稍後發送。`},
  '帳戶建立':{e:`系統帳戶已按您提供的用戶名單建立完成。請查閱附上的帳戶清單，確認用戶名稱及角色權限設定是否正確。\n\n各用戶的初次登入資料將分別以電郵發送至各用戶的登記電郵地址。`,w:`帳戶已按名單建立完成！請確認用戶名稱及角色權限是否正確。初次登入資料已發送至各用戶電郵 ✅`},
  '角色權限確認':{e:`請確認以下角色及權限設定是否符合貴機構的要求：\n\n• [角色 1]：[權限說明]\n• [角色 2]：[權限說明]\n\n如需調整任何角色的權限，請具體說明需要的修改。`,w:`請確認角色權限設定是否正確：[各角色說明]。如需調整請告知我們 ✅`},
  '測試環境準備':{e:`系統測試環境已就緒，現為您提供測試帳戶資料。\n\n• 測試環境網址：[URL]\n• 測試帳戶及密碼：已分別發送至各用戶電郵\n\n測試環境與正式環境完全獨立，可放心進行各類功能測試。`,w:`測試環境已準備好！🎉 網址：[URL]，帳戶資料已發至各用戶電郵。可以開始測試各項功能，有問題隨時告知 ✅`},
  '測試邀請':{e:`系統測試環境已就緒，誠邀您及團隊成員進行系統測試。\n\n測試重點建議：\n• 日常使用功能是否正常\n• 資料顯示是否正確\n• 權限設定是否符合要求\n• 報表生成是否準確\n\n測試期間如發現任何問題，請盡量記錄重現步驟及截圖。`,w:`請開始系統測試 😊 建議測試：功能是否正常、資料是否正確、權限是否符合、報表是否準確。發現問題請記錄重現步驟及截圖 📝`},
  '測試結果跟進':{e:`感謝您的測試及回饋。就您提出的問題，我們已進行跟進，修正完成後將通知您重新驗證。如有任何其他問題，請繼續告知。`,w:`感謝測試回饋！問題已跟進處理，修正完成後通知您重新驗證 ✅`},
  '上線確認':{e:`系統已完成所有測試及修正，現正式確認上線安排如下：\n\n📅 正式上線日期：{ref}\n\n上線前，請確保所有用戶已完成培訓，並備妥正式資料。如有任何顧慮，請盡早告知。`,w:`✅ 確認上線！正式上線日期：{ref}。請確保用戶已完成培訓，如需延遲請盡早告知 😊`},
  '上線後跟進':{e:`恭喜！{brand} 系統已正式上線。\n\n上線後初期，我們將密切跟進系統運作情況。如在使用過程中遇到任何問題，請隨時聯絡我們的支援團隊，我們將優先處理。`,w:`🎉 恭喜系統正式上線！初期我們會密切跟進，有任何問題請隨時找我們，優先處理 😊`},

 '帳戶與權限':{
  '登入困難':{e:`就您反映的登入問題，以下是一些常見解決方法：\n\n• 確認電郵地址輸入正確（區分大小寫）\n• 確認密碼正確（注意大小寫及特殊符號）\n• 嘗試清除瀏覽器緩存或使用無痕模式\n• 嘗試不同的瀏覽器或裝置\n\n如仍無法登入，請告知您看到的錯誤訊息，我們將協助查明原因。`,w:`登入問題常見解決：\n✅ 確認電郵/密碼正確（注意大小寫）\n✅ 清除瀏覽器緩存\n✅ 試試無痕模式或其他瀏覽器\n仍有問題請告知錯誤訊息截圖 📸`},
  '忘記密碼':{e:`請按以下步驟重設您的密碼：\n\n① 在登入頁面點擊「忘記密碼」\n② 輸入您的登記電郵地址\n③ 查收重設密碼電郵（請同時查看垃圾郵件夾）\n④ 點擊連結設定新密碼\n\n如未能收到重設電郵，請告知，我們可以協助從後台重設。`,w:`重設密碼：\n① 點「忘記密碼」\n② 輸入登記電郵\n③ 查收重設電郵（也查垃圾郵件夾）\n④ 設定新密碼\n收不到的話告知我們 😊`},
  '收不到驗證電郵':{e:`就您反映收不到驗證電郵的問題：\n\n• 檢查垃圾郵件及促銷郵件夾\n• 確認登記電郵地址是否正確\n• 嘗試重新發送驗證電郵\n\n如以上方法均無效，請告知您的帳戶電郵地址，我們可以在後台協助驗證帳戶。`,w:`收不到驗證電郵？先查一下：\n✅ 垃圾郵件夾\n✅ 確認電郵地址正確\n✅ 重新發送驗證電郵\n仍未收到請告知帳戶電郵，我們後台處理 😊`},
  '帳戶未啟用':{e:`就您的帳戶未啟用問題，可能原因如下：\n\n• 尚未點擊啟用電郵中的連結\n• 啟用電郵中的連結已過期\n\n請告知您的帳戶電郵地址，我們可以在後台重新發送啟用電郵或直接啟用您的帳戶。`,w:`帳戶未啟用？可能是未點啟用連結或連結已過期。請告知帳戶電郵，我們後台重發啟用郵件或直接啟用 😊`},
  '帳戶被停用':{e:`就您的帳戶被停用問題，可能原因包括：異常登入活動、管理員設定或帳戶到期。\n\n麻煩告知您的帳戶電郵地址，以便我們核查原因，並為您安排重新啟用（如符合條件）。`,w:`帳戶被停用？原因可能是異常活動或管理員設定。請告知帳戶電郵，我們幫您查明原因並處理 🙏`},
  '新增使用者':{e:`就新增使用者的請求，麻煩提供以下資料：\n\n• 新用戶姓名\n• 電郵地址\n• 所屬部門\n• 分配角色及權限\n\n確認後我們將建立帳戶並發送登入資料至用戶電郵。`,w:`新增用戶需要：姓名、電郵、部門、角色權限。確認後建立帳戶並發送登入資料至用戶電郵 ✅`},
  '更改角色':{e:`就更改用戶角色的請求，麻煩確認以下資料：\n\n• 用戶帳戶電郵\n• 現有角色 → 目標角色\n• 更改原因\n\n確認後我們將立即更新角色設定。`,w:`確認更改用戶角色：帳戶電郵、現有→新角色、更改原因。確認後立即更新 ✅`},
  '無權查看資料':{e:`就您反映無法查看特定資料的問題，可能原因為帳戶權限不足。\n\n麻煩告知：\n• 您的帳戶電郵\n• 嘗試查看的功能或資料範圍\n• 顯示的錯誤訊息\n\n確認後，我們將核查您的帳戶權限設定。`,w:`無權查看資料可能是帳戶權限不足。請告知：帳戶電郵、想查看的功能、錯誤訊息截圖。我們幫您核查 🔐`},
  '離職人員停權':{e:`就離職人員帳戶停用請求，麻煩提供以下資料：\n\n• 離職人員姓名及帳戶電郵\n• 生效日期\n• 是否需要轉移其管理的資料至其他人員\n\n確認後我們將立即停用相關帳戶，並妥善處理資料轉交。`,w:`停用離職人員帳戶：請提供姓名/電郵、生效日期，以及是否需要資料轉交。確認後立即處理 ✅`},
  '轉交管理員':{e:`就管理員帳戶轉交的請求，麻煩提供以下資料：\n\n• 現任管理員帳戶電郵\n• 新管理員姓名及電郵\n• 轉交日期\n• 是否需要保留原管理員的普通帳戶\n\n確認後我們將安排帳戶轉交事宜。`,w:`管理員帳戶轉交：請提供現任管理員、新管理員資料及轉交日期。是否保留原管理員帳戶？確認後處理 ✅`},
  '身份核實':{e:`為保障帳戶安全，在處理您的請求前，我們需要核實您的身份。\n\n麻煩提供以下資料以便驗證：\n• 帳戶登記電郵\n• 機構名稱\n• 聯絡電話（登記時提供）\n\n核實完成後我們將立即跟進您的請求。`,w:`為保障帳戶安全，在處理前需要核實身份 🔐 麻煩提供：帳戶電郵、機構名稱、聯絡電話（登記時的）。核實後立即跟進 ✅`},
 },
 '技術支援':{
  '收到問題確認':{e:`感謝您的回報。我們已收到您描述的問題，現正安排技術人員跟進。\n\n個案編號：{ref}\n\n我們將在 1 個工作天內回覆具體情況。如問題緊急影響正常業務，請告知，我們將提升優先處理級別。`,w:`已收到問題報告，個案編號：{ref}。技術團隊正在跟進，1 個工作天內回覆。如情況緊急請告知 ⚡`},
  '收集重現步驟':{e:`為便於技術團隊重現及排查問題，麻煩提供以下資料：\n\n• 問題發生的具體操作步驟（由第一步開始描述）\n• 問題發生的頻率（是否每次都出現？）\n• 問題發生的時間（首次發現時間）\n• 受影響的帳戶或功能範圍`,w:`為了排查問題，麻煩提供：\n① 操作步驟（從第一步描述）\n② 問題頻率（每次都出現？）\n③ 首次發生時間\n④ 受影響範圍\n越詳細越好 🙏`},
  '索取錯誤截圖':{e:`為便於技術團隊分析問題，麻煩提供以下截圖：\n\n• 問題發生時的畫面截圖（包括錯誤訊息）\n• 如可能，請同時提供瀏覽器開發者工具的錯誤記錄（按 F12 開啟，查看 Console 頁）`,w:`麻煩截圖問題發生時的畫面（包括錯誤訊息）📸 如可以，也截一下瀏覽器 Console 錯誤（按 F12 → Console）謝謝！`},
  '收集裝置及瀏覽器資料':{e:`為排查技術問題，麻煩提供以下環境資料：\n\n• 使用裝置：（電腦 / 手機 / 平板）\n• 作業系統及版本：（如 Windows 11 / macOS / iOS）\n• 瀏覽器及版本：（如 Chrome 120 / Safari）\n• 網絡環境：（辦公室 / 家用 / 流動數據）`,w:`麻煩提供環境資料幫助排查：\n裝置：電腦/手機/平板\n作業系統：（例 Windows 11）\n瀏覽器：（例 Chrome 120）\n網絡：辦公室/家用/流動數據 🔧`},
  '無法重現':{e:`感謝您的回報。我們在技術環境中嘗試重現問題，但暫時未能複現相同情況。\n\n麻煩嘗試以下步驟並告知結果：\n• 清除瀏覽器緩存及 Cookie\n• 以無痕模式重試\n• 重新整理頁面後再試\n\n如問題仍然出現，請提供重現步驟的操作錄影。`,w:`技術團隊暫時未能重現問題 🤔 請試試：清除緩存、無痕模式重試、重新整理頁面。仍然出現請提供操作錄影 📹`},
  '已重現':{e:`感謝您的詳細描述。技術團隊已成功重現您所描述的問題，確認這是一個需要修正的技術問題。\n\n個案編號：{ref}\n\n問題現已轉交開發團隊處理，預計修正時間將在確認後告知。`,w:`✅ 已重現問題確認，轉交開發團隊處理（個案：{ref}）。預計修正時間稍後通知 🔧`},
  '排查中':{e:`技術團隊正在積極排查您所描述的問題，目前進度：已確認問題範圍，排查進行中。\n\n我們將在有進一步進展時及時通知您。感謝您的耐心等待。`,w:`技術團隊正在排查中 🔧 有進展會及時通知您。感謝耐心等待 🙏`},
  '提供暫時處理方法':{e:`在問題修正期間，以下是一個臨時處理方法，可以幫助您繼續正常使用相關功能：\n\n[臨時處理方法說明]\n\n以上只是臨時方案，我們仍在積極修正根本問題，完成後將通知您更新。`,w:`臨時解決方案：[方法說明]。正式修正仍在進行，完成後通知您更新 ✅`},
  '升級技術團隊':{e:`鑑於問題的複雜性，我們已將您的個案升級至高級技術團隊處理。\n\n個案編號：{ref}\n\n高級技術團隊將優先跟進。我們了解問題對您的業務造成不便，對此深表歉意。`,w:`已升級至高級技術團隊處理（{ref}），對造成的不便深表歉意 🙏 將優先處理。`},
  '進度更新':{e:`就您的個案（{ref}），以下是最新進度更新：\n\n[進度更新說明]\n\n如有任何問題或需要補充資料，請隨時聯絡。`,w:`個案 {ref} 進度更新：[說明]。有問題請隨時聯絡 😊`},
  '修正待測':{e:`就您的個案（{ref}），技術修正已完成，目前進入內部測試階段，確認問題已解決後將通知您進行驗證。`,w:`修正已完成，正在內部測試中（{ref}）。測試通過後通知您驗證 ✅`},
  '修正完成':{e:`就您的個案（{ref}），技術問題已修正並通過測試，現已部署至正式環境。\n\n麻煩嘗試重新操作相關功能，確認問題是否已解決。如仍有問題，請告知。`,w:`修正已完成並部署（{ref}）！請嘗試重新操作，確認問題是否解決。如仍有問題請告知 ✅`},
  '客戶驗證':{e:`請問您已驗證修正是否有效嗎？麻煩嘗試重現之前的問題，並告知結果。\n\n如問題已解決，我們將關閉此個案。如問題仍然存在，請提供詳情以便繼續跟進。`,w:`請問修正後問題解決了嗎？麻煩試試重現之前的情況並告知 ✅ 解決了我們關閉個案，仍有問題繼續跟進 😊`},
  '問題復發':{e:`就您反映的問題復發情況，對此造成的不便深表歉意。\n\n我們已重新開啟個案（{ref}），技術團隊將深入排查問題根本原因，以防止同樣問題再次發生。`,w:`收到問題復發報告，非常抱歉！已重新開啟個案（{ref}），技術團隊深入排查根本原因，確保不再復發 🙏`},
  '結案':{e:`感謝您的確認。個案（{ref}）現正式結案。\n\n如日後遇到其他技術問題，歡迎隨時聯絡我們的技術支援團隊。感謝您的合作。`,w:`個案 {ref} 正式結案 ✅ 如之後遇到其他問題，隨時找我們！謝謝 😊`},
  '重新開啟個案':{e:`已根據您的要求重新開啟個案（{ref}）。\n\n技術團隊將重新跟進您的問題，請提供問題的最新情況及重現步驟，以便我們更有效地處理。`,w:`已重新開啟個案（{ref}）。麻煩提供問題最新情況及重現步驟，我們重新跟進 🔧`},
 },
 '資料與報表':{
  '資料未顯示':{e:`就您反映資料未顯示的問題，以下是一些常見原因及解決方法：\n\n• 確認篩選條件是否正確（日期範圍、部門等）\n• 確認帳戶是否有查看該資料的權限\n• 嘗試重新整理頁面\n\n如以上方法無效，請提供截圖及您的帳戶電郵，我們將協助查明原因。`,w:`資料未顯示？先確認：篩選條件正確嗎？帳戶有查看權限嗎？試試重新整理頁面。仍未顯示請截圖告知 📸`},
  '數字不一致':{e:`就您反映的數字不一致問題，可能涉及報表計算邏輯、時區設定、資料更新延遲或篩選條件不同。\n\n麻煩提供以下資料以便排查：\n• 出現不一致的具體報表及數字\n• 比對的另一來源\n• 相關截圖`,w:`數字不一致可能涉及計算邏輯、更新延遲或篩選條件不同。請提供：具體報表/數字及比對來源的截圖，我們幫您查明 🔍`},
  '報表篩選說明':{e:`就您查詢的報表篩選功能，報表可按以下維度篩選：\n\n• 日期範圍（日/週/月/自訂）\n• 部門或分店\n• 狀態（已完成/進行中/等待中）\n\n如需要幫助設定特定篩選條件，請告知您的報表需求，我們可以協助操作。`,w:`報表可按：日期範圍、部門/分店、狀態等篩選。需要幫助設定特定篩選條件嗎？告知需求我們協助 📊`},
  '匯出失敗':{e:`就您反映的報表匯出失敗問題，可能原因如下：\n\n• 資料量過大（建議分批匯出或縮小日期範圍）\n• 瀏覽器彈出視窗被阻擋（請允許彈出視窗）\n• 帳戶沒有匯出權限\n\n如以上方法無效，請告知錯誤訊息截圖，我們將進一步協助。`,w:`報表匯出失敗？試試：縮小日期範圍分批匯出、允許瀏覽器彈出視窗、確認帳戶有匯出權限。仍失敗請截圖告知 📸`},
  '資料更新延遲':{e:`系統資料通常每隔一定時間自動更新一次。如需即時查看最新資料，可嘗試手動刷新相關頁面。\n\n如延遲時間超出正常範圍，請告知具體情況，我們將安排技術人員查明原因。`,w:`系統資料定時自動更新，可嘗試手動刷新頁面。如延遲異常請告知，技術團隊查明原因 🔄`},
  '資料修正申請':{e:`就您的資料修正申請，麻煩提供以下資料：\n\n• 需要修正的具體資料（包括現有資料及正確資料）\n• 修正原因\n• 相關參考文件（如適用）\n\n確認後，我們將安排授權人員進行修正，並提供修正確認記錄。`,w:`資料修正申請：請提供現有資料/正確資料/修正原因及參考文件。確認後安排授權人員修正 ✅`},
  '誤刪資料求助':{e:`就您反映的誤刪資料問題，請盡快提供以下資料：\n\n• 被刪除的資料類型及大概數量\n• 刪除時間（越準確越好）\n• 操作人員帳戶\n\n我們將立即查閱系統備份記錄，嘗試為您還原資料。`,w:`⚠️ 誤刪資料！請立即提供：資料類型/數量、刪除時間（越準確越好）、操作人員帳戶。我們馬上查備份嘗試還原 🙏`},
  '備份及還原查詢':{e:`{brand} 系統進行每日自動備份。如需要還原特定時間點的資料，請說明所需日期及資料範圍，我們將評估可行性。`,w:`{brand} 每日自動備份。如需還原資料請告知所需日期及資料範圍，我們評估可行性 💾`},
  '操作記錄查詢':{e:`系統保存了各用戶的操作稽核記錄，包括：\n\n• 登入/登出時間\n• 資料新增/修改/刪除記錄\n• 匯出記錄\n\n請提供查詢的時間範圍及相關帳戶，我們將提供相應的操作記錄報告。`,w:`查詢操作記錄：系統保存登入/資料修改/匯出等記錄。請提供查詢時間範圍及相關帳戶，我們提供記錄報告 📋`},
 },
 'API 與整合':{
  '整合前評估':{e:`在開始整合工作前，我們需要進行技術評估，了解：\n\n• 目標整合系統名稱及版本\n• 整合類型（單向/雙向資料同步）\n• 需要同步的資料類型\n• 目標系統的 API 文件（如有）\n\n評估完成後，我們將提供整合方案建議及相關報價。`,w:`整合評估需要了解：目標系統、整合類型（單向/雙向）、同步資料類型、API 文件（如有）。評估後提供方案及報價 🔗`},
  '授權指引':{e:`為完成第三方系統整合授權，請按以下步驟操作：\n\n① 登入第三方系統\n② 前往「設定」→「API 設定」或「整合設定」\n③ 生成 API 金鑰或授權 Token\n④ 將金鑰通過安全渠道發送給我們`,w:`授權步驟：\n① 登入第三方系統\n② 前往 API/整合設定\n③ 生成 API 金鑰\n④ 通過安全渠道發送給我們\n有問題告知截圖 🔐`},
  '授權失效':{e:`我們偵測到第三方系統的整合授權已失效，可能導致資料同步中斷。\n\n請按指引重新授權，完成後系統將自動恢復資料同步。如操作有任何問題，請告知。`,w:`⚠️ 整合授權已失效，資料同步已中斷！請重新授權，完成後同步自動恢復 🔗`},

    '簡潔':{'道歉為主':`${g}\n\n感謝聯絡，就您遇到的問題，非常抱歉為您帶來不便。`,'中性告知':`${g}\n\n感謝聯絡，就您的查詢，回覆如下。`,'積極跟進':`${g}\n\n感謝聯絡，已即時跟進您的請求。`,'感謝回應':`${g}\n\n感謝您的聯絡及支持。`},
  };
  return tos[style]?.[tone]||tos['正式']['中性告知'];
}

function getStatusNote(status,channel){
  const em=channel==='email';
  const m={'待跟進':em?'我們將於下一個工作天內安排跟進。':'我們將盡快跟進。','跟進中':em?'我們目前正積極跟進此事項，有任何進展將立即通知您。':'我們正在跟進中，有更新會通知您。','等待客戶回覆':em?'麻煩您在方便時回覆，以便我們繼續跟進。':'麻煩方便時回覆，讓我們繼續跟進 🙏','已完成':em?'此事項已處理完成，如有任何其他問題歡迎再次聯絡。':'已處理完成！有其他問題隨時找我們 ✅','已升級':em?'此個案已升級至高級支援團隊，將優先處理。':'已升級至高級團隊處理，優先跟進 ⚡','已轉交':em?'此事項已轉交相關部門處理，將有專人跟進。':'已轉交相關部門，將有專人跟進 ✅'};

}

function getClosingEmail(style,brand,agent,email,wa){
  const lines=[];
  if(ST.addContact&&(email||wa)){lines.push('如有任何其他問題，歡迎透過以下方式聯絡我們：');if(email)lines.push(`電郵：${email}`);if(wa)lines.push(`WhatsApp：${wa}`);}
  const contact=lines.length?'\n\n'+lines.join('\n'):'';
  const sign=ST.addSign?(style==='簡潔'?`\n\n${agent||brand+' 客服'}`:`\n\n此致\n${agent?agent+'\n':''}${brand} 客服團隊`):'';

function getWAOpening(tone,name){
  const n=name||'您好';

}

function getWAClosing(style,brand,agent,email,wa){
  const ci=[];
  if(ST.addContact&&(email||wa))ci.push([email,wa].filter(Boolean).join(' / '));
  const c=ci.length?`\n\n如有需要可聯絡：${ci[0]}`:'';
  const signs={'正式':`${c}\n\n感謝您的合作。\n${agent?agent+'\n':''}${brand} 客服`,'親切':`${c}\n\n有任何問題隨時找我們！😊\n${agent?agent+'\n':''}${brand} 客服`,'簡潔':`${c}\n\n${agent||brand}`};

function generate(){
  const p={brand:ST.brand||'OmniStompboxs',name:ST.cname,ref:ST.ref,agent:ST.agent};
  const tpl=BODY[ST.cat]?.[ST.subcat];
  const rawB=tpl?tpl[ST.channel==='email'?'e':'w']:`【${ST.subcat}】相關處理正在跟進中，我們將盡快為您回覆。`;
  const body=fill(rawB,p);
  const sn=getStatusNote(ST.status,ST.channel);
  if(ST.channel==='email'){
    const op=fill(getOpeningEmail(ST.tone,ST.style,p.name,p.brand),p);
    const cl=getClosingEmail(ST.style,p.brand,p.agent,ST.coEmail,ST.coWa);
    return[op,body,sn,cl].filter(Boolean).join('\n\n');
  }else{
    const op=fill(getWAOpening(ST.tone,p.name),p);
    const cl=getWAClosing(ST.style,p.brand,p.agent,ST.coEmail,ST.coWa);
    return[op,body,sn,cl].filter(Boolean).join('\n\n');
  }
}

const BLOG_SEC_H=new Set(['這次更新了甚麼','對誰有幫助','如何使用','適用範圍與注意事項','下一步','維護時間','影響範圍','維護前請注意','維護完成後']);

function blogToHtml(raw,type){
  return raw.trim().split(/\n\n+/).map((para,pi)=>{
    const lines=para.split('\n');
    const html=lines.map((line,li)=>{
      const t=line.trim();
      if(BLOG_SEC_H.has(t)){
        const cls=type==='maint'?'blog-sec blog-sec-org':'blog-sec';
        return`<strong class="${cls}">${he(t)}</strong>`;
      }
      const esc=he(line).replace(/\{\{([^}]+)\}\}/g,(_,p)=>`<span class="ph">{{${p}}}</span>`);
      if(pi===0&&li===0&&type==='update'&&line.includes('｜'))return`<span class="blog-dateline">${esc}</span>`;
      return esc;
    }).join('<br>');
    return`<p class="mb-2">${html}</p>`;
  }).join('');
}

  }else{
    blogBtn.className='flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white shadow-sm';
    csBtn.className='flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all';
    cc.style.display='none';bc.style.display='flex';hc.style.display='none';
    renderBlogChips();refreshBlogPreview();
  }
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(function init(){
  let total=0;Object.values(CATS).forEach(v=>total+=v.length);
  document.getElementById('total-count').textContent=total;
  const cs=document.getElementById('cat');
  cs.innerHTML=Object.keys(CATS).map(c=>`<option value="${he(c)}"${c===ST.cat?' selected':''}>${he(c)}</option>`).join('');
  renderSubcats();refreshAll();renderBlogChips();
})();
</script>
