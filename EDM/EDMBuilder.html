function im(ev){
 const file=ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=e=>{
  const m=e.target.result.match(/<!--\s*EDM-DATA:([\s\S]*?)-->/);
  if(!m){alert("找不到資料，請確認此 HTML 由本工具導出。");return;}
  try{
   D=dc(JSON.parse(m[1].trim().replace(/--\\>/g,"-->")));
   if(D._tpl && TEMPLATES[D._tpl]){
    currentTpl=D._tpl;
    document.querySelectorAll('.tbtn').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.color='';b.style.borderColor='';});
    const tplBtn=document.getElementById('tpl_'+currentTpl);
    if(tplBtn){tplBtn.classList.add('on');tplBtn.style.background=TPL_COLORS[currentTpl];tplBtn.style.color='#fff';tplBtn.style.borderColor=TPL_COLORS[currentTpl];}
   }
   buildEd();rf();
  }
  catch(x){alert("資料解析失敗。");}
 };
 r.readAsText(file);ev.target.value="";
}
