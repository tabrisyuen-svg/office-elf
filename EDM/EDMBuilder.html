function gServices(sv){

 return`<div style="padding:44px 40px 36px;"><h2 style="color:${sv.titleColor};font-size:18px;font-weight:800;text-align:center;margin:0 0 28px;">${q(sv.title)}</h2><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>${cells}</tr></table><p style="text-align:center;color:${sv.noteColor};font-size:12px;margin:20px 0 0;">${q(sv.note)}</p></div>`;
}

function gFinalCta(fc){return`<div style="background:linear-gradient(145deg,${fc.bgFrom} 0%,${fc.bgTo} 100%);padding:48px 40px;text-align:center;"><h2 style="color:${fc.titleColor};font-size:21px;font-weight:800;margin:0 0 14px;line-height:1.4;">${qb(fc.title)}</h2><p style="color:${fc.textColor};font-size:14px;line-height:1.8;max-width:460px;margin:0 auto 26px;">${q(fc.text)}</p><a href="${q(fc.btn.link)}" style="display:inline-block;background:#fff;color:${fc.btn.textColor};padding:13px 32px;border-radius:6px;text-decoration:none;font-weight:800;font-size:14px;">${q(fc.btn.text)}</a></div>`;}

function gFooter(ft){
 const ls=ft.links.map(l=>`<a href="${q(l.link)}" style="color:${ft.linkColor};font-size:12px;text-decoration:none;margin:0 9px;">${q(l.text)}</a>`).join("");
 return`<div style="background:${ft.bg};padding:32px 40px;text-align:center;"><div style="color:${ft.logoColor};font-weight:800;font-size:15px;margin-bottom:8px;">${q(ft.logoText)}</div><div style="color:${ft.descColor};font-size:12.5px;margin-bottom:14px;line-height:1.7;">${qb(ft.desc)}</div><div style="color:${ft.contactColor};font-size:12px;margin-bottom:18px;line-height:1.9;">查詢電郵：${q(ft.email)}<br>官方網站：${q(ft.website)}</div><div style="margin-bottom:16px;">${ls}</div><div style="color:${ft.copyrightColor};font-size:11px;margin-bottom:12px;">${q(ft.copyright)}</div><div style="font-size:11px;"><a href="{{ unsubscribe_link }}" style="color:${ft.linkColor};text-decoration:underline;">取消訂閱</a></div></div>`;
}

function genEmail(){
 const data=JSON.stringify(D).replace(/-->/g,"--\\>");
 return`<!DOCTYPE html>
<html lang="zh-HK">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OmniStompboxs School</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f2f5;}.w{max-width:640px;margin:0 auto;background:#fff;}@media(max-width:520px){.w{width:100%!important;}table td{display:block!important;width:100%!important;padding:0 0 14px 0!important;}}</style>
</head>
<body>{{ open_tracking_block }}
<div class="w">${gNav(D.nav)}${gHero(D.hero)}${gIntro(D.intro)}${gFeatures(D.features)}${gSecurity(D.security)}${gMidCta(D.midCta)}${gServices(D.services)}${gFinalCta(D.finalCta)}${gFooter(D.footer)}</div>
</body>
<!-- EDM-DATA:${data} -->
</html>`;
}

function rsz(){
 const f=document.getElementById("fr");
 try{f.style.height=Math.max(800,f.contentDocument.documentElement.scrollHeight+40)+"px";}catch(x){}
}
function rf(){document.getElementById("fr").srcdoc=genEmail();}
function sm(m){
 const f=document.getElementById("fr"),bd=document.getElementById("bd"),bm=document.getElementById("bm2");
 if(m==="m"){f.style.width="375px";f.classList.add("mb");bd.classList.remove("on");bm.classList.add("on");}
 else{f.style.width="600px";f.classList.remove("mb");bd.classList.add("on");bm.classList.remove("on");}
}

// EXPORT / IMPORT
// ═══════════════════════════════════════
function ex(){
 const b=new Blob([genEmail()],{type:"text/html;charset=utf-8"});
 const u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download="edm-school.html";
 document.body.appendChild(a);a.click();
 document.body.removeChild(a);URL.revokeObjectURL(u);
}
function im(ev){
 const file=ev.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=e=>{
  const m=e.target.result.match(/<!--\s*EDM-DATA:([\s\S]*?)-->/);
  if(!m){alert("找不到資料，請確認此 HTML 由本工具導出。");return;}
  try{Object.assign(D,JSON.parse(m[1].trim().replace(/--\\>/g,"-->")));buildEd();rf();}
  catch(x){alert("資料解析失敗。");}
 };
 r.readAsText(file);ev.target.value="";
}

// EDITOR
// ═══════════════════════════════════════
const FM={};
function reg(id,get,set){FM[id]={get,set};}
function upd(id,v){if(FM[id]){FM[id].set(v);rf();}}

function buildEd(){
 for(const k in FM)delete FM[k];
 let h="";
 const I=(id,lbl,gfn,sfn)=>{reg(id,gfn,sfn);return`<label for="${id}">${lbl}</label><input type="text" id="${id}" value="${q(gfn())}" oninput="upd('${id}',this.value)">`;};
 const T=(id,lbl,gfn,sfn)=>{reg(id,gfn,sfn);return`<label for="${id}">${lbl}</label><textarea id="${id}" oninput="upd('${id}',this.value)" rows="3">${q(gfn())}</textarea>`;};
 const C=(id,lbl,gfn,sfn)=>{reg(id,gfn,sfn);return`<label for="${id}" style="display:flex;align-items:center;gap:5px;"><input type="color" id="${id}" value="${gfn()}" oninput="upd('${id}',this.value)">${lbl}</label>`;};

 h+=`<hr><h4>🧭 導航欄</h4>`;
 h+=C("n_bg","背景色",()=>D.nav.bg,v=>D.nav.bg=v);
 h+=I("n_lt","Logo 文字",()=>D.nav.logoText,v=>D.nav.logoText=v);
 h+=C("n_lc","Logo 顏色",()=>D.nav.logoTextColor,v=>D.nav.logoTextColor=v);
 h+=I("n_ll","Logo 連結",()=>D.nav.logoLink,v=>D.nav.logoLink=v);
 h+=C("n_mc","選單文字顏色",()=>D.nav.menuTextColor,v=>D.nav.menuTextColor=v);
 D.nav.menus.forEach((m,i)=>{
  h+=`<div class="c"><div class="ct">選單 ${i+1}</div>`;
  h+=I(`nm${i}t`,"文字",()=>D.nav.menus[i].text,v=>D.nav.menus[i].text=v);
  h+=I(`nm${i}l`,"連結",()=>D.nav.menus[i].link,v=>D.nav.menus[i].link=v);
  h+=`</div>`;
 });

 // HERO
 h+=`<hr><h4>🎯 Hero</h4>`;
 h+=`<div class="row">${C("h_bf","漸層起色",()=>D.hero.bgFrom,v=>D.hero.bgFrom=v)}${C("h_bt","漸層終色",()=>D.hero.bgTo,v=>D.hero.bgTo=v)}</div>`;
 h+=I("h_ew","Eyebrow",()=>D.hero.eyebrow,v=>D.hero.eyebrow=v);
 h+=C("h_ewc","Eyebrow 顏色",()=>D.hero.eyebrowColor,v=>D.hero.eyebrowColor=v);
 h+=T("h_ti","標題（Enter 換行）",()=>D.hero.title,v=>D.hero.title=v);
 h+=C("h_tic","標題顏色",()=>D.hero.titleColor,v=>D.hero.titleColor=v);
 h+=I("h_at","Accent 文字",()=>D.hero.accentText,v=>D.hero.accentText=v);
 h+=C("h_ac","Accent 顏色",()=>D.hero.accentColor,v=>D.hero.accentColor=v);
 h+=T("h_tx","副標題",()=>D.hero.text,v=>D.hero.text=v);
 h+=C("h_txc","副標題顏色",()=>D.hero.textColor,v=>D.hero.textColor=v);
 D.hero.tags.forEach((t,i)=>{h+=I(`ht${i}`,`Hashtag ${i+1}`,()=>D.hero.tags[i],v=>D.hero.tags[i]=v);});
 h+=`<div style="font-size:11px;font-weight:bold;color:#374151;margin:6px 0 2px;">▸ 主按鈕</div>`;
 h+=I("h_pt","文字",()=>D.hero.btnPrimary.text,v=>D.hero.btnPrimary.text=v);
 h+=I("h_pl","連結",()=>D.hero.btnPrimary.link,v=>D.hero.btnPrimary.link=v);
 h+=C("h_pc","顏色",()=>D.hero.btnPrimary.color,v=>D.hero.btnPrimary.color=v);
 h+=`<div style="font-size:11px;font-weight:bold;color:#374151;margin:6px 0 2px;">▸ 輪廓按鈕</div>`;
 h+=I("h_ot","文字",()=>D.hero.btnOutline.text,v=>D.hero.btnOutline.text=v);
 h+=I("h_ol","連結",()=>D.hero.btnOutline.link,v=>D.hero.btnOutline.link=v);
 h+=`<div class="row">${C("h_oc","文字色",()=>D.hero.btnOutline.color,v=>D.hero.btnOutline.color=v)}${C("h_ob","邊框色",()=>D.hero.btnOutline.borderColor,v=>D.hero.btnOutline.borderColor=v)}</div>`;

 // INTRO
 h+=`<hr><h4>📝 簡介</h4>`;

 h+=I("i_bl","按鈕 B 連結",()=>D.intro.btnB.link,v=>D.intro.btnB.link=v);

 // FEATURES
 h+=`<hr><h4>✨ 六大功能</h4>`;
 h+=I("f_ti","區塊標題",()=>D.features.title,v=>D.features.title=v);
 h+=I("f_su","副標題",()=>D.features.subtitle,v=>D.features.subtitle=v);

 D.features.items.forEach((it,i)=>{

  h+=I(`fi${i}lt`,"連結文字",()=>D.features.items[i].linkText,v=>D.features.items[i].linkText=v);

 });

 // SECURITY
 h+=`<hr><h4>🔐 安全管理</h4>`;
 h+=I("s_ti","區塊標題",()=>D.security.title,v=>D.security.title=v);

 D.security.items.forEach((it,i)=>{

 });
 h+=T("s_nt","備注文字",()=>D.security.noteText,v=>D.security.noteText=v);
 h+=I("s_nl","連結文字（需與備注一致）",()=>D.security.noteLinkText,v=>D.security.noteLinkText=v);
 h+=I("s_nu","連結 URL",()=>D.security.noteLinkUrl,v=>D.security.noteLinkUrl=v);

 // MID CTA
 h+=`<hr><h4>💡 中部號召</h4>`;

 h+=T("mc_tx","說明文字",()=>D.midCta.text,v=>D.midCta.text=v);
 h+=I("mc_bt","按鈕文字",()=>D.midCta.btn.text,v=>D.midCta.btn.text=v);
 h+=I("mc_bl","按鈕連結",()=>D.midCta.btn.link,v=>D.midCta.btn.link=v);
 h+=C("mc_bc","按鈕顏色",()=>D.midCta.btn.color,v=>D.midCta.btn.color=v);

 // SERVICES
 h+=`<hr><h4>🛎 服務項目</h4>`;
 h+=I("sv_ti","標題",()=>D.services.title,v=>D.services.title=v);
 D.services.items.forEach((it,i)=>{
  h+=`<div class="c"><div class="ct">服務 ${i+1}</div>`;
  h+=I(`sv${i}ic`,"Icon",()=>D.services.items[i].icon,v=>D.services.items[i].icon=v);
  h+=I(`sv${i}ti`,"標題",()=>D.services.items[i].title,v=>D.services.items[i].title=v);

 });

 // FINAL CTA

 h+=T("fc_ti","標題（Enter 換行）",()=>D.finalCta.title,v=>D.finalCta.title=v);
 h+=C("fc_tc","標題顏色",()=>D.finalCta.titleColor,v=>D.finalCta.titleColor=v);
 h+=T("fc_tx","說明文字",()=>D.finalCta.text,v=>D.finalCta.text=v);

 h+=`<hr><h4>📌 頁尾</h4>`;

 D.footer.links.forEach((l,i)=>{

 });
 h+=I("ft_cp","版權文字",()=>D.footer.copyright,v=>D.footer.copyright=v);
 h+=C("ft_cpc","版權顏色",()=>D.footer.copyrightColor,v=>D.footer.copyrightColor=v);
 h+=`<div style="height:48px"></div>`;
 document.getElementById("ef").innerHTML=h;
}

buildEd();
rf();
</script>
